[pytest]
# `pip install -e .` is a silent no-op on this machine under Python 3.14 (site.py
# skips hidden .pth files), so the import path is set here rather than by an
# editable install. Running `pytest` from the repo root is the supported path.
pythonpath = .
testpaths = tests
addopts = -q
filterwarnings =
    error::DeprecationWarning
