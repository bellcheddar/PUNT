# Dead air. Weighted low and on long cooldowns: the whole point is that these
# are what you get when nothing has happened, so hearing one twice in an hour
# means the afternoon was quiet, and hearing one twice in five minutes means the
# bank is too small.
#
# Filler carries no slots by design. It is said during a gap, and a gap has no
# player, no manager and no number attached to it.

- id: fill_01
  trigger: {kind: FILLER}
  tone: [dry]
  weight: 3
  cooldown: 1800
  text: "Nothing is happening. This is most of football."
  voice: colour
- id: fill_02
