# Touchdowns. The loudest routine event of the afternoon, so this is the biggest
# category and the one where repetition shows first.
#
# House rule, applied throughout: roast the manager, never the player. A real
# athlete having a bad day is not the joke; a league member who started him is.
#
# `cooldown` is in seconds and converted to Moments at the poll rate, so a replay
# at 60x behaves like a Sunday at 1x.

- id: td_generic_01
  trigger: {kind: TOUCHDOWN}
  tone: [hype]
  roast_level: 0
  weight: 4
  cooldown: 900
  text: "{player} finds the end zone! {delta} on the board for {manager}."
  audio: horn_01
  voice: pbp

- id: td_generic_02
  trigger: {kind: TOUCHDOWN}
  tone: [hype]
  weight: 4
  cooldown: 900
  text: "Touchdown {player}! {manager} takes {delta}."
  audio: horn_01
  voice: pbp

- id: td_generic_03
  trigger: {kind: TOUCHDOWN}
  tone: [hype, corny]
  weight: 3
  cooldown: 1020
  text: "{player} walks it in. {manager}, that is {delta} you did nothing to earn."
  audio: horn_02
  voice: pbp

- id: td_generic_04
  trigger: {kind: TOUCHDOWN}
  tone: [corny]
  weight: 3
  cooldown: 1020
  text: "Six and change for {player}. {manager} is up to {total}."
  audio: horn_01
  voice: pbp

- id: td_generic_05
  trigger: {kind: TOUCHDOWN}
  tone: [hype]
  weight: 3
  cooldown: 1020
  text: "{player} scores. {manager} allowed himself to hope and was right for once."
  roast_level: 1
  audio: horn_02
  voice: colour

- id: td_generic_06
  trigger: {kind: TOUCHDOWN}
  tone: [corny]
  weight: 2
  cooldown: 1200
  text: "That is {player} in the end zone and {manager} out of his seat."
  audio: horn_01
  voice: pbp

- id: td_generic_07
  trigger: {kind: TOUCHDOWN}
  tone: [dry]
  weight: 2
  cooldown: 1200
  text: "{player}, touchdown. {manager} will be insufferable for roughly nine minutes."
  roast_level: 1
  audio: horn_02
  voice: colour

- id: td_generic_08
  trigger: {kind: TOUCHDOWN}
  tone: [hype]
  weight: 2
  cooldown: 1200
  text: "In he goes! {player} for {delta}, and {manager} is not sitting down."
  audio: horn_02
  voice: pbp

- id: td_generic_09
  trigger: {kind: TOUCHDOWN}
  tone: [corny]
  weight: 2
  cooldown: 1200
  text: "{player} punches it in. Somewhere, {manager} is telling everyone he called it."
  roast_level: 1
  audio: horn_01
  voice: colour

- id: td_generic_10
  trigger: {kind: TOUCHDOWN}
  tone: [dry]
  weight: 2
  cooldown: 720
  text: "Touchdown. {player}. {manager} moves to {total}, which is a number he will now repeat all night."
  roast_level: 1
  audio: horn_02
  voice: colour

