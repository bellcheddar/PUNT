# Touchdowns. The loudest routine event of the afternoon, so this is the biggest
# category and the one where repetition shows first.
#
# House rule, applied throughout: roast the manager, never the player. A real
# athlete having a bad day is not the joke; a league member who started him is.
#
# `cooldown` is in seconds and converted to Moments at the poll rate, so a replay
# at 60x behaves like a Sunday at 1x.

- id: td_generic_01
  trigger: {kind: TOUCHDOWN}
  tone: [hype]
  roast_level: 0
  weight: 4
  cooldown: 900
  text: "{player} finds the end zone! {delta} on the board for {manager}."
  audio: horn_01
  voice: pbp

