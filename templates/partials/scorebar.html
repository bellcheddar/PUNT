{% if matchups %}
  {% for m in matchups %}{% include "partials/matchup.html" %}{% endfor %}
{% else %}
  <div class="empty">
    <strong>No matchups yet</strong>
    Week {{ snap.scoring_period }} has not been scheduled, or ESPN has not answered yet.
  </div>
{% endif %}
<details class="panel-note" id="note-scorebar" hx-preserve="true">
  <summary>Details</summary>
  Live scores, with where each matchup is projected to finish.
</details>
