{% extends "base.html" %}
{% block title %}PUNT &middot; Album{% endblock %}
{% block content %}
<section class="panel">
  <h2 class="panel-title">Week {{ snap.scoring_period }} &middot; ten cards</h2>
  <div hx-get="{{ url_for('api.partial_album') }}"
       hx-trigger="every {{ poll_seconds }}s"
       hx-swap="innerHTML">
    {% include "partials/album_grid.html" %}
  </div>
  <p class="album-note">
    Cards are minted once a week and the pack opens once.
    <button class="banner-action" type="button" onclick="window.PUNT_PACK &amp;&amp; window.PUNT_PACK.again()">
      Rip it again
    </button>
  </p>
</section>
{% endblock %}
