# nginx vhost for punt.mdeller.com. Installed by provision.sh, which then runs
# certbot to add the TLS block.
#
# READ BEFORE EDITING: certbot rewrites this file in place to add the 443 server
# block. provision.sh re-runs certbot on EVERY run for that reason -- copying
# this template over the live config and not re-running it deletes HTTPS, and
# fails silently, because the port 80 block left behind is valid on its own and
# `nginx -t` still passes.

server {
    listen 80;
    listen [::]:80;
    server_name punt.mdeller.com;

    # The SHARED access log, in the vhost format. The site-wide hit counter globs
    # access.log* and mdeller.access.log*; a vhost that redirects its log to a
    # private file is invisible to it and reads a flat zero for ever, with the
    # beacon firing perfectly and nothing to say why. The format name is not
    # optional: a bare `access_log /path;` silently means `combined`, which has
    # no $host.
    access_log /var/log/nginx/access.log vhost;

    client_max_body_size 2m;

    # --- the live stream ---------------------------------------------------
    # SSE needs every buffering layer between gunicorn and the phone turned off.
    # nginx buffers a proxied response by default, which holds an event until the
    # buffer fills -- i.e. for ever, on a stream that sends a few hundred bytes a
    # minute. The app sets X-Accel-Buffering: no as well; this is the belt.
    location /stream {
        proxy_pass http://127.0.0.1:8011;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding off;
        # A Sunday evening can be quiet for minutes at a time and the connection
        # must survive it.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # --- pre-synthesised speech -------------------------------------------
    # The filename is the hash of exactly what is spoken, so the content behind a
    # URL can never change.
    location /audio/phrase/ {
        proxy_pass http://127.0.0.1:8011;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # --- stamped assets ----------------------------------------------------
    # CSS, JS and fonts are only ever requested with a ?v= mtime stamp, so a
    # deploy changes the URL rather than needing the cache invalidated. That is
    # what makes `immutable` safe here and nowhere else under /static/.
    #
    # `access_log off;` must NOT be added to any of these blocks. mdeller.com
    # counts a hit for this app by watching the shared access log for a request
    # only a rendering browser makes; with logging off that traffic is invisible
    # and the count reads zero for ever with nothing to show why. The shared
    # snippet carries the same warning.
    # A named capture, because `alias` inside a regex location must end in one:
    # nginx refuses to start with a bare directory alias here, and the error
    # names the directive rather than the reason.
    location ~ ^/static/(?<stamped>(?:css|js|fonts)/.+)$ {
        alias /opt/punt/static/$stamped;

        include /etc/nginx/snippets/long-cache.conf;

        # theme.css alone is 37 kB of highly compressible text, and htmx and
        # howler another 60 kB. woff2 is deliberately absent from gzip_types:
        # it is already compressed, and gzipping it burns CPU to make the file
        # marginally larger.
        gzip on;
        gzip_types text/css text/javascript application/javascript image/svg+xml;
        gzip_min_length 1024;
    }

    # --- everything else under /static/ ------------------------------------
    # Icons, the splash screens, the manifest and the audio sprites. These are
    # fetched WITHOUT a stamp -- by the manifest, by the service worker and by
    # howler -- so `immutable` would pin a year-old icon on every returning
    # phone with no way to replace it. Thirty days and revalidation instead.
    location /static/ {
        alias /opt/punt/static/;
        add_header Cache-Control "public, max-age=2592000" always;
    }

    # --- everything else ---------------------------------------------------
    location / {
        proxy_pass http://127.0.0.1:8011;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;

        # NO add_header Cache-Control here. The app sets it (see
        # `_register_cache_control` in app.py), and it has to be the app that
        # does, because `add_header` APPENDS: the team-logo routes set their own
        # `public, max-age=86400`, both headers went out, and a browser joins
        # repeated Cache-Control field lines into one value where `no-cache`
        # wins. Every logo was revalidated on every page load while each response
        # looked correct on its own.
    }
}
